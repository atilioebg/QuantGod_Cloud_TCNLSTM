[pytest]
pythonpath = src
asyncio_mode = auto
testpaths = tests
# -v: verbose, -s: show print statements, --durations: find slow tests, -n 12: parallel 12 workers
addopts = -v -s --durations=5 -n 12

# Configuração de Logs Automáticos
log_file = logs/tests/last_run.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
log_cli = true
log_cli_level = INFO