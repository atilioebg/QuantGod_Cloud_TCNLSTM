# Backtest Config - Cloud GPU (/workspace)
# ----------------------------------------

# Paths Config
pipeline_paths:
  # Caminhos relativos ao PROJECT_ROOT (/workspace/QuantGod_Cloud_TCNLSTM)
  local_data_root: "data/backtest/L2"
  raw_zip_dir: "data/backtest/L2/raw_zip"
  raw_trades_dir: "data/backtest/L2/raw_trades"
  pre_processed_dir: "data/backtest/L2/pre_processed"
  labelled_dir: "data/backtest/L2/labelled"
  
  # Model Assets (Champion 2026_03_21) - Usando caminhos do repo ou volume
  model_path: "MODELS_BACKTEST/MODELOS/best_tcn_lstm_dir.pt"
  auditor_path: "MODELS_BACKTEST/MODELOS/auditor_xgboost.json"
  config_path: "MODELS_BACKTEST/CONFIG/best_params.json"
  
  # Reports
  output_dir: "/workspace/data/backtest/reports"

# Simulation Config
simulation:
  initial_capital: 10000
  leverage: 10
  trading_fee: 0.0006
  auditor_threshold: 0.65  # Confidence minimum for Trade approval
  
# Processing
processing:
  n_workers: 4  # No Cloud podemos usar múltiplos workers com segurança
  levels: 200
  sampling_ms: 100
