# Backtest Config - Cloud GPU (/workspace)
# ----------------------------------------

model:
  auditor:
    manual_threshold: 0.975


# Paths Config
pipeline_paths:
  # Caminhos relativos ao PROJECT_ROOT (/workspace/QuantGod_Cloud_TCNLSTM)
  local_data_root: "data/backtest/L2"
  raw_zip_dir: "data/backtest/L2/raw_zip"
  raw_trades_dir: "data/backtest/L2/raw_trades"
  pre_processed_dir: "data/backtest/L2/pre_processed"
  labelled_dir: "data/backtest/L2/labelled"
  
  # Model Assets (Champion 2026_03_21) - Production Tree Parity
  # Estes caminhos são relativos ao models_local_dir definido abaixo
  best_tcn_lstm_model: "BASE_MODEL/best_tcn_lstm_dir.pt"
  auditor_model:       "AUDITOR/auditor_xgboost.json"
  scaler_foundation:   "BASE_MODEL/scaler_foundation.pkl"
  scaler_auditor:      "AUDITOR/scaler_auditor.pkl"
  auditor_oof_dir:     "SPECIALIST" # Localizado dentro de MODELS_BACKTEST/MODELOS/
  
  # Reports
  output_dir: "data/backtest/reports"

# ── [EXECUÇÃO] Configuração do Motor de Inferência ──────────────────
execution:
  # Obriga o InferenceService a usar nossa pasta baixada
  models_local_dir: "MODELS_BACKTEST/MODELOS"
  dynamic_security_threshold: false
  manual_security_threshold: 0.70

# Simulation Config
simulation:
  initial_capital: 10000
  leverage: 10
  trading_fee: 0.0006
  auditor_threshold: 0.70  # Confidence minimum for Trade approval
  
# Processing
processing:
  n_workers: 2  # Mirror da Scale Guard
  levels: 200
  sampling_ms: 100
