# Backtest Config - Cloud GPU (/workspace)
# ----------------------------------------

model:
  auditor:
    # [DNA DO MODELO]  Threshold ideal encontrado no Treino (Optuna HPO).
    # Baseline original do modelo: 0.5 (o antigo 0.975 era erro de cópia do reg_alpha).
    manual_threshold: 0.5


# ── [DNA DO MODELO] Configuração de Paridade com Treino ──────────────
pre_processing:
  etl:
    dollar_threshold_usd: 500000.0
    tick_threshold: 5000
    information_threshold_ofi: 100.0
    cusum_vol_span: 144
    cusum_h_factor: 2.2
  labelling:
    pt_multiplier: 0.65
    sl_multiplier: 0.33
    horizon_minutes: 15

# Paths Config
pipeline_paths:
  local_data_root: "data/backtest/L2"
  raw_zip_dir:       "data/backtest/L2/labelled/BTC_USDT_L2_2023_2026"
  raw_trades_dir:     "data/backtest/L2/labelled/BTC_USDT_L2_TRADE_2023_2026"
  pre_processed_dir:  "data/backtest/L2/pre_processed"
  labelled_dir:       "data/backtest/L2/labelled"
  session_timestamp: "2026_03_28"
  
  # Model Assets (Champion 2026_03_21)
  best_tcn_lstm_model: "BASE_MODEL/best_tcn_lstm.pt"
  auditor_model:       "AUDITOR/auditor_xgboost.json"
  scaler_foundation:   "BASE_MODEL/scaler_foundation.pkl"
  scaler_auditor:      "AUDITOR/scaler_auditor.pkl"
  auditor_oof_dir:     "SPECIALIST"
  
  # Reports
  output_dir: "data/backtest/reports"

# ── [EXECUÇÃO] Configuração do Motor de Inferência ──────────────────
execution:
  # Usar o formato virtual nativo do projeto. O InferenceService resolverá isso localmente.
  models_local_dir: "drive:PROJETOS/RESULTADOS"
  dynamic_security_threshold: false
  manual_security_threshold: 0.50

# Simulation Config
simulation:
  initial_capital: 10000
  leverage: 10
  trading_fee: 0.0006
  # [V4.29] Horizonte de Saída (Soberania)
  # 20 minutos de tempo para permitir a colheita do Alvo 2.5.
  horizon_minutes: 20
  
  # [PRODUÇÃO] Threshold oficial para o InferenceService. 
  # Calibrado para Elite Sniper 0.892 (V4.29) para ROI VERDE.
  manual_security_threshold: 0.891
  auditor_threshold: 0.891
  auditor_authority_threshold: 0.892
  trade_cooldown_minutes: 480 # [V4.26] 8h de silêncio para máxima qualidade.

  # [SIMULAÇÃO TWIN] Limiares para recriar as barras de EVENTO do treino
  # O backtest vai acumular ticks de 1s até atingir um destes gatilhos.
  # Quando atinge, ele atualiza a volatilidade 'Anchor' de 5 min.
  event_sampling:
    dollar_threshold_usd: 500000.0
    tick_threshold: 5000
    information_threshold_ofi: 100.0
    resample_freq_min: 5

  # [SINCRONIA COM TREINO] Multiplicadores de Volatilidade Dinâmica (Prado ADR)
  # Estes valores multiplicam a volatilidade do BTC para definir alvos realistas.
  pt_multiplier: 2.5 # [V4.29] Soberania: Alvo agressivo em relação ao stop (6.5x).
  sl_multiplier: 0.38 # [V4.29] Ponto Áureo: Equilíbrio entre resiliência e proteção.
  
# Processing
processing:
  n_workers: 2  # Mirror da Scale Guard
  levels: 200
  sampling_ms: 100
