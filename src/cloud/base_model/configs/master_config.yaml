# =============================================================================
# MASTER CONFIGURATION — Single Source of Truth for QuantGod TCN+LSTM Pipeline
# =============================================================================

pipeline_paths:
  # Base directories and files
  raw_l2_source: "drive:PROJETOS/BTC_USDT_L2_2023_2026"
  db_path: "sqlite:///optuna_tcn_lstm_v1_finetune.db"
  best_tcn_lstm_model: "data/models/best_tcn_lstm.pt"
  best_tcn_lstm_dir_model: "data/models/best_tcn_lstm_dir.pt"
  best_specialized_model: "data/models/best_specialized_model.pt"
  scaler_foundation: "data/models/scaler_foundation.pkl"
  scaler_specialized: "data/models/scaler_specialized.pkl"

pre_processing:
  etl:
    levels: 200
    sampling_ms: 1000
    export_compression: "snappy"
  labelling:
    # Set thresholds and windows here
    sell_threshold: 0.003
    buy_threshold: 0.003
    horizon_minutes: 15
  split:
    base:
      train_ratio: 0.70
      val_ratio: 0.20
    specialized:
      train_ratio: 0.85
      val_ratio: 0.15

model:
  num_features: 32
  num_classes: 3
  feature_names:
    # --- Aggregated Features (9) ---
    - body                # Corpo da vela: log(close/open)
    - upper_wick          # Sombra superior normalizada
    - lower_wick          # Sombra inferior normalizada
    - log_ret_close       # Retorno logarítmico: log(close/prev_close)
    - volatility          # Volatilidade intra-minuto
    - max_spread          # Spread máximo
    - mean_obi            # Order Book Imbalance (Top 1)
    - mean_deep_obi       # Order Book Imbalance Profundo (L5)
    - log_volume          # Proxy de Volume (log messages)
    
    # --- Dynamic/Sniper Features (23) ---
    - ofi                 # Order Flow Imbalance (L0)
    - ofi_delta_1         # Gatilho de Fluxo (5min - 1 bar)
    - ofi_delta_6         # Aceleração de Fluxo (30min - 6 bars)
    - micro_price_momentum # Momentum Acumulado Micro-Price
    - micro_price_delta_1 # Gatilho de Preço Real (5min - 1 bar)
    - micro_price_delta_6 # Drift de Preço Real (30min - 6 bars)
    - bid_slope           # Inclinação dos Bids
    - ask_slope           # Inclinação dos Asks
    - bid_rdi             # Relative Depth Imbalance (Bid)
    - bid_rdi_delta_1     # Choque de Profundidade Bid (5min)
    - bid_rdi_delta_6     # Contexto de Profundidade Bid (30min)
    - ask_rdi             # Relative Depth Imbalance (Ask)
    - ask_rdi_delta_1     # Choque de Profundidade Ask (5min)
    - ask_rdi_delta_6     # Contexto de Profundidade Ask (30min)
    - book_asymmetry_v5   # Assimetria L5
    - spread_zscore_60    # Spread Relativo (60min = 12 bars)
    - vpin_lite_5         # Toxicidade de Volume (25min = 5 bars)
    - kyle_lambda         # Kyle's Lambda (Price resistance to flow)
    - bid_deep_ratio      # Razão Profunda Bid (L200/L5)
    - ask_deep_ratio      # Razão Profunda Ask (L200/L5)
    - bid_convexity       # Convexidade Bid (L10 vs L20)
    - ask_convexity       # Convexidade Ask (L10 vs L20)
    - pressure_ratio      # Razão de Pressão L2

training:
  # FocalLoss with Label Smoothing settings
  foundation_weights:
    use_auto_class_weights: true
    class_weights: [1.32, 0.40, 1.30]
    gamma: 2.0      # Controla o foco da penalidade em amostras difíceis (focal loss)
    smoothing: 0.1  # Suaviza os labels (label smoothing) para evitar overconfidence
  specialization_weights:
    use_auto_class_weights: true
    class_weights: [4.85, 0.38, 4.61]
    gamma: 2.0      # Controla o foco da penalidade em amostras difíceis (focal loss)
    smoothing: 0.1  # Suaviza os labels (label smoothing) para evitar overconfidence

optimization:
  study_name: "quantgod_tcn_lstm_v1_finetune"
  n_trials: 60
  timeout: 72000  # 20 hours
  base_metric: "f1_macro"
  specialized_metric: "f1_macro" #"f1_dir"
  run_specialized_after: false
  run_feature_importance_after: true

  search_space:
    tcn_channels: [64, 128, 256]
    lstm_hidden: [64, 128, 256]
    num_lstm_layers: [3, 4, 5, 6, 7, 8, 9]
    lr: [0.00001, 0.00006]
    weight_decay: [0.0001, 0.01]
    batch_size: [512, 1024, 2048]
    seq_len: [24, 48, 96]
    dropout: [0.3, 0.5, 0.75, 0.80]
    epochs: 50
    early_stopping_patience: 4
