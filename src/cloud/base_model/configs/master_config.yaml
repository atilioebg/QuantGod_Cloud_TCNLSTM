# =============================================================================
# MASTER CONFIGURATION — Single Source of Truth for QuantGod TCN+LSTM Pipeline
# =============================================================================

pipeline_paths:
  # Caminhos base da arquitetura
  raw_l2_source: "drive:PROJETOS/BTC_USDT_L2_2023_2026"           # Fonte Remota via Rclone (Mode: Streaming)
  db_path: "sqlite:///optuna_tcn_lstm_v1_finetune.db"             # Banco de dados do Optuna HPO
  best_tcn_lstm_model: "data/models/best_tcn_lstm.pt"             # Local path for stress test
  best_tcn_lstm_dir_model: "data/models/best_tcn_lstm_dir.pt"
  best_specialized_model: "data/models/treino_best_model.pt"
  scaler_foundation: "data/models/scaler_foundation.pkl"          # Normalizador fitado no Treino (Fundação)
  scaler_specialized: "data/models/scaler_specialized.pkl"        # Normalizador fitado no Treino (Especialista)
  auditor_model: "data/models/auditor_xgboost.json"               # Modelo de Regras XGBoost (Juiz Auditor)
  scaler_auditor: "data/models/scaler_auditor.pkl"                # Normalizador fitado no Treino (Auditor)

pipeline_control:
  force_full_retrain: true                                        # Se false, tenta carregar estágios já concluídos usando checkpoints
  skip_qa_on_failure: false                                       # Aborta o processo se um log de QA apontar anomalia grave
  retention_policy: "keep_all"                                    # Mantém logs de rodadas anteriores (evita sobrescrever blindly)
  gpu_memory_management: true                                     # Ativa limpezas agressivas de cache (gc.collect/empty_cache) entre fases

pre_processing:
  etl:
    levels: 200                                                   # Profundidade em níveis coletada no L2 Orderbook (max 500 na Binance)
    sampling_ms: 1000                                             # Cadência de captura dos snapshots em ms (1000ms = 1 snap/s antes do resample)
    export_compression: "snappy"                                  # Algoritmo de compressão dos Parquets (snappy=rápido, gzip=menor)
    flow_depth: 5                                                 # Top-N níveis usados para OFI, Slope e RDI — Wall liquidity sem ruído profundo
    use_dynamic_workers: true                                     # [NOVO] True: vCPUs - 1; False: Usa max_workers abaixo
    max_workers: 15                                               # Número de workers quando use_dynamic_workers=false

    # ── Clipping & Auditoria (v4.5 Patch) ──────────────────────
    clipping:
      enabled: true                                               # Ativa Soft-Clipping (Winsorization)
      p99_multiplier: 10                                          # Teto: 10x o Percentil 99
      target_columns: ['kyle_lambda', 'vpin_min25', 'max_spread', 'ofi', 'bid_deep_ratio', 'ask_deep_ratio', 'bid_convexity', 'ask_convexity', 'book_asymmetry_v5']
      noise_floor: 0.00001                                        # Piso de ruído: não clippar se o P99 for menor que isso
    audit:
      generate_report: true                                       # Gera docs/reports/data_quality_report.json

    # ── Agregação temporal ──────────────────────────────────────
    resample_freq: "1min"                                         # Frequência do resample: '1min' (alta capilaridade, ~1440 barras/dia) ou '5min' (modo legado, ~288 barras/dia).
                                                                  # IMPACTO: alterar este valor é seguro — todas as janelas abaixo são em MINUTOS REAIS e o ETL converte para barras automaticamente.

    # ── Janelas de features derivadas (em MINUTOS REAIS) ─────────────
    # As janelas abaixo definem TEMPO REAL, não barras. O ETL calcula:
    #   barras = janela_min / resample_freq_minutos
    # Isso garante que o significado econômico de cada indicador se preserve
    # independentemente da frequência escolhida em resample_freq.
    spread_zscore_window_min: 60                                  # Stress de liquidez: Z-Score do spread em janela de 60 minutos reais (termômetro de squeeze de mercado).
    vpin_window_min: 25                                           # Toxicidade de fluxo: VPIN Lite em janela de 25 minutos reais (détecção de ordem informada).
    delta_short_min: 5                                            # Lookback curto: diff/pct_change de 5 minutos reais — captura choques e gatilhos de microestrutura.
    delta_long_min: 30                                            # Lookback longo: diff/pct_change de 30 minutos reais — captura drift e contexto de momentum.

    # ── Estrutura do livro para features de profundidade ────────────
    book_asymmetry_depth: 5                                       # Número de níveis usados para Book Asymmetry V5: log(sum_bids_N / sum_asks_N)
    deep_book_start: 50                                           # Nível de início da janela "profunda" do livro para Deep-to-Front Ratio (L{start}–L{levels})
    convexity_near_end: 10                                        # Limite superior dos níveis "perto" para Book Convexity (L1–L{near_end} vs L{near_end+1}–L{far_end})
    convexity_far_end: 20                                         # Limite superior dos níveis "longe" para Book Convexity
  labelling:
    # Limiares de alvo futuro (Rentabilidade para Target 0 ou 2)
    sell_threshold: 0.0005                                        # REDUZIDO: Para ter sinais em dataset de 1 dia
    buy_threshold: 0.0005                                         # REDUZIDO
    horizon_minutes: 15                                           # Janela de Lookahead para calcular a rentabilidade (15 minutos)
    use_dynamic_workers: false                                    # Se true: usa os.cpu_count()-1 dinâmico; se false: usa max_workers abaixo
    max_workers: 14                                               # Número de workers paralelos quando use_dynamic_workers=false (útil em cloud com CPUs fixas conhecidas)
  split:
    base:
      train_ratio: 0.70                                           # Split Cronológico de Treinamento da Fundação (TCN-LSTM)
      val_ratio: 0.30                                             # Split Cronológico de Validação da Fundação OOS
    specialized:
      train_ratio: 0.80                                           # Treinamento do Especialista (TCN-LSTM) engolindo mais tempo cronológico
      val_ratio: 0.20                                             # Validação Restrita do Especialista
    auditor:
      train_ratio: 0.80                                           # Treinamento do XGBoost na extração conjunta de features cruzadas
      val_ratio: 0.20                                             # Validação Test-Final Auditor Pipeline

  kfold:
    enabled: true                                                 # Liga K-Fold OOF no Especialista. Se false: usa run_specialization.py legado (Holdout 80/20).
    n_splits: 5                                                   # Número de folds cronológicos (Blocked K-Fold). Cada fold cobre ~20% do Foundation Val.
    purge_minutes: 15                                             # Janela de Purga em minutos. Deve ser >= horizon_minutes para quebrar correlação serial.
                                                                  # Garante: max(treino_ts) + purge_min < min(teste_ts). Default = horizon_minutes = 15min.
    specialist_epochs: 1                                          # REDUZIDO: Modo de teste E2E
    use_best_foundation_arch: true                                # Se true: usa best_params.json da Fundação sem re-otimizar (Symmetric Delta não é executado).
                                                                  # Poupa GPU: cada fold treina a MESMA arquitetura vencedora, variando apenas os pesos.
    oof_output_dir: "data/auditor/oof_predictions"                # Diretório onde os logits de cada fold e o full_oof.parquet serão salvos.

model:
  num_features: 24                                                # Quantidade de colunas injetadas nos tensores matriciais (Base model) — ETL v4.3 (1min)
  num_classes: 3                                                  # BUY (2), NEUTRAL (1), SELL (0)
  
  auditor:
    num_features: 20                                              # Tensores do Juiz (6 Probabilidades Modelos + 14 Sensores Alphas)
    num_classes: 2                                                # Meta-Labeling Binário: 0 (Veto/Fake), 1 (Aprovado/Acurado)
    use_dynamic_threshold: true                                   # Se true, procura limiar F-Beta (0.5) dinamicamente na Precision-Recall curve
    manual_threshold: 0.65                                        # Fallback caso use_dynamic_threshold seja false
  
  feature_names:                                                  # Nome das colunas injetadas nos tensores matriciais (Base model)
                                                                  # IMPORTANTE: Nomes baseados em MINUTOS REAIS (ETL v4.3).
                                                                  # Ex: ofi_delta_5 = OFI com lookback de 5 minutos reais.
                                                                  # ETL calcula: suffix = delta_short_min (5min) ou delta_long_min (30min).
    # --- Aggregated Features (9) ---
    - body                                                        # Corpo da vela: log(close/open)
    - upper_wick                                                  # Sombra superior normalizada
    - lower_wick                                                  # Sombra inferior normalizada
    - log_ret_close                                               # Retorno logarítmico: log(close/prev_close)
    - volatility                                                  # Volatilidade intra-minuto
    - max_spread                                                  # Spread máximo
    - mean_obi                                                    # Order Book Imbalance (Top 1)
    - mean_deep_obi                                               # Order Book Imbalance Profundo (L5)
    - log_volume                                                  # Proxy de Volume (log messages)
    
    # --- Dynamic/Sniper Features (15) — nomes em MINUTOS REAIS ---
    - ofi                                                         # Order Flow Imbalance (L0)
    - ofi_delta_5                                                 # Gatilho de Fluxo: delta_short_min=5min (ETL v4.3)
    - ofi_delta_30                                                # Aceleração de Fluxo: delta_long_min=30min (ETL v4.3)
    - micro_price_momentum                                        # Momentum Acumulado Micro-Price
    - micro_price_delta_5                                         # Gatilho de Preço Real: delta_short_min=5min
    - micro_price_delta_30                                        # Drift de Preço Real: delta_long_min=30min
    - bid_rdi                                                     # Relative Depth Imbalance (Bid)
    - bid_rdi_delta_5                                             # Choque de Profundidade Bid: 5min
    - bid_rdi_delta_30                                            # Contexto de Profundidade Bid: 30min
    - ask_rdi                                                     # Relative Depth Imbalance (Ask)
    - ask_rdi_delta_5                                             # Choque de Profundidade Ask: 5min
    - ask_rdi_delta_30                                            # Contexto de Profundidade Ask: 30min
    - spread_zscore_60                                            # Spread Relativo: spread_zscore_window_min=60min
    - vpin_min25                                                  # Toxicidade de Volume: vpin_window_min=25min
    - kyle_lambda                                                 # Kyle's Lambda (Price resistance to flow)

  auditor_features:
    - base_prob_sell                                              # Logits convertidos Base Model (Sell)
    - base_prob_neu                                               # Logits convertidos Base Model (Neutral)
    - base_prob_buy                                               # Logits convertidos Base Model (Buy)
    - spec_prob_sell                                              # Logits convertidos Specialist Model (Sell)
    - spec_prob_neu                                               # Logits convertidos Specialist Model (Neutral)
    - spec_prob_buy                                               # Logits convertidos Specialist Model (Buy)
    - ema_trend                                                   # Sinal de Regressão da EMA Cross (8, 21)
    - ema_cross_dist                                              # Distância percentual do preço em relação ao cruzamento
    - bb_pct                                                      # Bollinger Bands Width Percentage
    - rsi_14                                                      # Relative Strength Index (Período 14)
    - stoch_14                                                    # Oscilador Estocástico (Período 14)
    - atr_norm                                                    # Average True Range (Normalized)
    - vol_1h                                                      # Sumatório do Volume na última hora
    - vol_zscore_1h                                               # Z-Score Direcional do volume de 1h
    - delta_vol_24h                                               # Deriva/Percentual da Aceleração do volume em 24h
    - adx_14                                                      # Average Directional Index (Tendência Forte/Fraca)
    - vwap_zscore                                                 # Distância percentual Z-Scoreizada do Preço em relação à VWAP
    - mfi_14                                                      # Money Flow Index (Absorção e Divergência de Volume)
    - book_skew_bid                                               # Assimetria (Skewness) do Order Book nas ordens de Compra
    - book_skew_ask                                               # Assimetria (Skewness) do Order Book nas ordens de Venda

training:
  # Lógica da FocalLoss com Label Smoothing Anti-Overconfidence
  foundation_weights:
    use_auto_class_weights: true                                  # Balanço automático baseado na demografia de sinais do dataset real
    class_weights: [1.32, 0.40, 1.30]                             # Fallback Manual (Suprime Neutros Fortemente p/ balancear)
    gamma: 2.0                                                    # Focal Loss (Aumenta o foco de gradiente nas amostras difíceis)
    smoothing: 0.1                                                # Label Smoothing (Preenche os alvos Zero/Um com 10% de ruidos suavisadores)
  specialization_weights:
    use_auto_class_weights: true                                  # Habilita balanço pro modelo Especialista
    class_weights: [4.85, 0.38, 4.61]                             # Pesos draconianos para forçar saídas SELL/BUY em vez de apenas prever Neutro
    gamma: 2.0                                                    # Penalidade de erro continua agressiva
    smoothing: 0.1                                                # Evita que hiperconcordância com classe desbalanceada superstime as predições

optimization:
  study_name: "quantgod_tcn_lstm_v1_finetune"                     # Nome de identificação do experimento interno no banco SQLite
  n_trials: 2                                                       # REDUZIDO: Modo de teste E2E
  n_trials_specialist: 2                                          # REDUZIDO: Modo de teste E2E
  timeout: 72000                                                  # Teto limite cronometrado na Nuvem (Ex: Parada rígida em 20 horas de máquina ~ 72000s)
  base_metric: "f1_macro"                                         # Macro F1 busca treinar a Inteligência Média global da Base com equidade
  specialized_metric: "sniper_score"                              # O Otimizador customizado Híbrido que extraíremos a fundo a Ouro de Alpha do ML
  sniper_weights:
    dir: 0.7                                                      # A métrica Direcional (Buy e Sell ignorando Neutral) engole 70% do peso da F1
    macro: 0.3                                                    # A métrica Macro (Global F1) atua como termostato anti-sobreajuste (Overfitting) a 30%
  run_specialized_after: true                                     # [AUTOMAÇÃO] Habilita Cascata Nuvem (Fundação > Especialista > Auditor XGB)
  run_feature_importance_after: true                              # Ao fim da Base, roda e salva a Força dos 32 Alphas originais (Integridade)

  search_space:
    tcn_channels: [64, 128, 256]                                  # Filtros Dinâmicos Captadores Visuais (TCN - Redes Residuais Causais)
    lstm_hidden: [64, 128, 256]                                   # Topologia Vetorial Oculta dos Blocos Neurais em Memória Tensa (LTSM) 
    num_lstm_layers: [3, 4, 5, 6, 7, 8, 9]                        # Níveis Arquiteturais Subterrâneos Empilhados (Mapeamento Complexo)
    lr: [0.00001, 0.00006]                                        # Multiplicador do Passo Gradient Descendente (AdamW) do Erro Perceptual
    weight_decay: [0.0001, 0.01]                                  # Controle Punitivo de Regularização (Peso Descontado Extra sobre a Perda)
    batch_size: [512, 1024, 2048]                                 # Lotes Simultâneos injetados Paralelamente na VRAM do Fio Tenson (Cuda GPU)
    seq_len: [24, 48, 96]                                         # Túnel Histórico Causal (Lookback de 24 a 96 Minutos de Micro-Estrutura do L2)
    dropout: [0.3, 0.5, 0.75, 0.80]                               # Taxa de Esvaziamento Neuronal Artifical p/ Forçar Abstração Distribuída
    epochs: 1                                                     # REDUZIDO: Modo de teste E2E
    early_stopping_patience: 4                                    # Inteligência Auxiliar que Morre a Trial após X rounds inférteis
