
# =============================================================================
# Base Model Configuration — Single Source of Truth
# Both run_optuna.py and run_training.py load from this file.
# To change class weights, edit ONLY here.
# =============================================================================

model:
  num_features: 32
  num_classes: 3
  feature_names:
    # --- Aggregated Features (9) ---
    - body                # Corpo da vela: log(close/open)
    - upper_wick          # Sombra superior normalizada
    - lower_wick          # Sombra inferior normalizada
    - log_ret_close       # Retorno logarítmico: log(close/prev_close)
    - volatility          # Volatilidade intra-minuto
    - max_spread          # Spread máximo
    - mean_obi            # Order Book Imbalance (Top 1)
    - mean_deep_obi       # Order Book Imbalance Profundo (L5)
    - log_volume          # Proxy de Volume (log messages)
    
    # --- Dynamic/Sniper Features (23) ---
    - ofi                 # Order Flow Imbalance (L0)
    - ofi_delta_1         # Gatilho de Fluxo (5min - 1 bar)
    - ofi_delta_6         # Aceleração de Fluxo (30min - 6 bars)
    - micro_price_momentum # Momentum Acumulado Micro-Price
    - micro_price_delta_1 # Gatilho de Preço Real (5min - 1 bar)
    - micro_price_delta_6 # Drift de Preço Real (30min - 6 bars)
    - bid_slope           # Inclinação dos Bids
    - ask_slope           # Inclinação dos Asks
    - bid_rdi             # Relative Depth Imbalance (Bid)
    - bid_rdi_delta_1     # Choque de Profundidade Bid (5min)
    - bid_rdi_delta_6     # Contexto de Profundidade Bid (30min)
    - ask_rdi             # Relative Depth Imbalance (Ask)
    - ask_rdi_delta_1     # Choque de Profundidade Ask (5min)
    - ask_rdi_delta_6     # Contexto de Profundidade Ask (30min)
    - book_asymmetry_v5   # Assimetria L5
    - spread_zscore_60    # Spread Relativo (60min = 12 bars)
    - vpin_lite_5         # Toxicidade de Volume (25min = 5 bars)
    - kyle_lambda         # Kyle's Lambda (Price resistance to flow)
    - bid_deep_ratio      # Razão Profunda Bid (L200/L5)
    - ask_deep_ratio      # Razão Profunda Ask (L200/L5)
    - bid_convexity       # Convexidade Bid (L10 vs L20)
    - ask_convexity       # Convexidade Ask (L10 vs L20)
    - pressure_ratio      # Razão de Pressão L2

training:                 # peso das classes para o treinamento, podem ser inseridos manualmente, caso contrario serão calculados automaticamente
  foundation_weights:
    use_auto_class_weights: true
    class_weights: [1.32, 0.40, 1.30]  # Example fallback/manual
  specialization_weights:
    use_auto_class_weights: true
    class_weights: [4.85, 0.38, 4.61]  # Example fallback/manual
