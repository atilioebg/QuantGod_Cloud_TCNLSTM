# Cloud Configuration for QuantGod
paths:
  rclone_mount: "drive:PROJETOS/BTC_USDT_L2_2023_2026"
  rclone_config: "rclone.conf"
  processed_output: "data/L2/pre_processed"
  scaler_path: "data/artifacts/scaler.pkl"

etl:
  sampling_interval_ms: 1000  # 1s
  resampling_interval: "5min"  # Sniper Pivot — 5min bars (288/day)
  orderbook_levels: 200      # Hard Cut 200
  compression: "snappy"
  batch_size_zips: 10        # Number of zips to process in a single batch
  max_workers: 14            # Max parallel threads for processing Zips

features:
  normalization: "log_returns" # log_returns, z-score, or both
  apply_zscore: false
