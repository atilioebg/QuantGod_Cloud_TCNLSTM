# Labelling Configuration
paths:
  input_dir: "data/L2/pre_processed"
  output_dir: "data/L2/labelled"

params:
  lookahead: 3            # 15min lookahead for 5min candles (3 bars × 5min)
  threshold_long: 0.003   # +0.30% for Buy signal (2) — Sniper pivot calibration
  threshold_short: -0.003 # -0.30% for Sell signal (0) — Sniper pivot calibration
  # Neutrals (1) are otherwise
