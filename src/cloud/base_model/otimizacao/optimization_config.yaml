
paths:
  train_dir: "AUTO"
  val_dir: "AUTO"
  study_name: "quantgod_tcn_lstm_v0"
  db_path: "sqlite:///optuna_tcn_lstm_v0.db"

optimization:
  n_trials: 50
  timeout: 72000  # 20 hours
  metric: "f1_macro"
  run_specialized_after: false

# Sniper Alpha 🎯 Search Space (Minimalist & Rigid)
search_space:
  tcn_channels: [16, 32, 64]          # "Slim" TCN: Reduced capacity to fight overfitting
  lstm_hidden: [64, 128]              # "Slim" LSTM: Essential temporal features only
  num_lstm_layers: [2]
  
  lr: [0.00001, 0.0001]               # Conservative LR
  weight_decay: [0.00001, 0.001]      # L2 Regularization tuned
  
  batch_size: [512, 1024]
  
  # Sniper Horizon (1h to 6h lookback)
  seq_len: [60, 120, 180, 240, 300, 360]
  
  dropout: [0.70, 0.85]               # Extreme Dropout: Forcing structural robustness
  epochs: 10
  early_stopping_patience: 3          # Stricter pruning to avoid "rotting" overfits