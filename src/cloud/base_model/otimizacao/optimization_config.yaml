
paths:
  train_dir: "AUTO"
  val_dir: "AUTO"
  study_name: "quantgod_tcn_lstm_v0"
  db_path: "sqlite:///optuna_tcn_lstm_v0.db"

optimization:
  n_trials: 50
  timeout: 72000  # 20 hours
  metric: "f1_macro"
  run_specialized_after: false

# Sniper Pro - Calibrado para RTX A4500 + 833 Colunas
search_space:
  tcn_channels: [32, 64, 128]         # Aumentado: Mais filtros para as 833 colunas
  lstm_hidden: [128, 256]             # Aumentado: Precisamos de mais "cérebro" para correlações L200
  num_lstm_layers: [2]
  
  lr: [0.00001, 0.00008]              # Mais conservador: Evita que o modelo "se perca" no início
  weight_decay: [0.0001, 0.01]        # L2 agressivo para manter a rede magra
  
  batch_size: [1024]                  # Travado: Sua GPU lida com 1024 rindo, melhor estabilidade
  
  # Contexto de 1h a 3h em barras de 5min (12, 24, 36 bars × 5min)
  seq_len: [12, 24, 36]
  
  dropout: [0.75, 0.82]               # Estreitado: O "Sweet Spot" identificado nos logs
  epochs: 10
  early_stopping_patience: 3