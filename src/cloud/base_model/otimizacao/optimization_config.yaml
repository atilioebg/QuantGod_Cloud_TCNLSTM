
paths:
  train_dir: "AUTO"
  val_dir: "AUTO"
  study_name: "quantgod_tcn_lstm_v1_finetune"
  db_path: "sqlite:///optuna_tcn_lstm_v1_finetune.db"

optimization:
  n_trials: 40
  timeout: 72000  # 20 hours
  metric: "f1_macro"
  run_specialized_after: false

# Sniper Pro - Fine-Tuning (Exploitation Phase based on v0 Trial 33 & 11)
search_space:
  tcn_channels: [64, 128, 256]                 # Travado: Venceu em F1 Macro e Dir
  lstm_hidden: [64, 128, 256]             # O modelo oscilou bem entre 128 (Dir) e 256 (Macro)
  num_lstm_layers: [1, 2, 3]
  
  lr: [0.00001, 0.00006]              # Estreitado ao redor de 5e-5 e 2e-5 dos campeões
  weight_decay: [0.0001, 0.01]        # L2 agressivo para manter a rede magra (Trial 11 amou wd alto)
  
  batch_size: [512, 1024, 2048]                  # Travado para estabilidade da GPU
  
  # Contexto vitorioso: 2h em barras de 5min (24 bars × 5min)
  seq_len: [24, 48, 96]
  
  dropout: [0.3, 0.5, 0.75, 0.80]               # Estreitado: O "Sweet Spot" (Trial 33: 0.759 / Trial 11: 0.771)
  epochs: 50                         # Aumentado levemente pois o early_stopping poda rápido
  early_stopping_patience: 4          # Tolerância sutilmente maior para fine-tuning